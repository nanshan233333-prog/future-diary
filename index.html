document.addEventListener('click', function(e) {
  var anchor = e.target.closest('a');
  if (anchor) {
    var href = anchor.getAttribute('href');
    if (href && href.startsWith('#')) {
      e.preventDefault();
      var targetId = href.slice(1);
      var target = document.getElementById(targetId);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      }
    }
  }
});
</script>

.stamp-layer{position:fixed; inset:0; z-index:55; display:none; align-items:center; justify-content:center; pointer-events:none;}
.stamp-layer.on{display:flex;}
.stamp{position:relative; width:150px; height:150px; border-radius:34%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#F3D06A,#E0AC3C); color:#fff; border:3px solid rgba(255,253,246,.9);
  box-shadow:0 0 0 9px rgba(217,169,60,.16), 0 20px 44px rgba(178,138,42,.32);
  opacity:0; transform:scale(.2) rotate(-24deg);}
.stamp-layer.on .stamp{animation:stampDrop 1.2s cubic-bezier(.24,1.5,.42,1) forwards;}
@keyframes stampDrop{
  0%  {opacity:0; transform:scale(1.7) rotate(-16deg);}
  16% {opacity:1; transform:scaleX(1.16) scaleY(.8) rotate(-6deg);}
  32% {transform:scaleX(.88) scaleY(1.16) rotate(3.5deg);}
  46% {transform:scaleX(1.07) scaleY(.93) rotate(-2deg);}
  58% {transform:scaleX(.96) scaleY(1.04) rotate(1.4deg);}
  70% {transform:scale(1) rotate(-3.4deg);}
  84% {transform:scale(1) rotate(-.6deg);}
  100%{opacity:1; transform:scale(1) rotate(-2.4deg);}
}
.stamp-char{font-family:var(--hand); font-size:66px; line-height:1; color:#FFFDF6;
  text-shadow:0 2px 0 rgba(150,110,30,.22);}
.stamp-ring{position:absolute; inset:11px; border-radius:30%; border:2px dashed rgba(255,253,246,.62);}
.stamp .spark{position:absolute; right:0; top:-2px; font-size:24px; color:#FFF7DC; opacity:0;
  transform-origin:center; animation:sparkPop 1.05s var(--ease) .28s forwards;}
@keyframes sparkPop{0%{opacity:0; transform:scale(0) rotate(-45deg);} 45%{opacity:1; transform:scale(1.25) rotate(12deg);} 100%{opacity:0; transform:scale(1.5) rotate(34deg);}}
.burst{position:absolute; inset:0; pointer-events:none;}
.burst i{position:absolute; left:50%; top:50%; font-style:normal; line-height:1; opacity:0;
  transform:translate(-50%,-50%); animation:burstOut .95s var(--ease) forwards; animation-delay:var(--d,0s);}
@keyframes burstOut{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(0deg);}
  20%{opacity:1;}
  100%{opacity:0; transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px))) scale(1.05) rotate(var(--rot,0deg));}
}
.page-turn{position:fixed; top:0; bottom:0; left:0; width:100%; z-index:58; pointer-events:none; opacity:0; perspective:1300px;}

@keyframes leafTurn{0%{transform:rotateY(0deg);} 100%{transform:rotateY(-168deg);}}

        if(ok){ try{ localStorage.setItem(KEY,raw); }catch(e){ mem=raw; } } else { mem=raw; } },

  function themeOf(n){ n=Number(n); for(var i=0;i<THEMES.length;i++){ if(THEMES[i].n===n) return THEMES[i]; } return THEMES[0]; }

  var state = Store.load() || defaultState();

  if(typeof state.currentDay!=='number'||state.currentDay<1) state.currentDay=1;
  function save(){ Store.save(state); }
  function dayData(n){ n=Number(n); if(!state.days[n]) state.days[n]={good:'',mood:'',done:false,supplement:'',memo:''}; if(typeof state.days[n].supplement!=='string') state.days[n].supplement=''; if(typeof state.days[n].memo!=='string') state.days[n].memo=''; return state.days[n]; }
  function doneCount(){ var c=0; for(var i=1;i<=7;i++){ if(state.days[i]&&state.days[i].done) c++; } return c; }
  function nextUnfinished(){ for(var i=1;i<=7;i++){ if(!(state.days[i]&&state.days[i].done)) return i; } return 7; }

  /* ---------- 屏幕路由 ---------- */
  var $=function(id){ return document.getElementById(id); };
  var SCREENS={cover:'screen-cover', guide:'screen-guide', daily:'screen-daily', companion:'screen-companion', graduation:'screen-graduation', review:'screen-review'};
  var currentScreen='cover';
  function show(name){
    var id=SCREENS[name]; if(!id){ return; }
    var next=$(id); if(!next){ return; }
    var list=document.querySelectorAll('.screen');
    for(var i=0;i<list.length;i++){ if(list[i]!==next) list[i].classList.remove('active'); }
    next.classList.add('active');
    next.scrollTop=0;
    currentScreen=name;
    updateTopBack();
  }
  function updateTopBack(){
    var b=$('topBack'); if(!b){ b=document.createElement('button'); b.id='topBack'; b.type='button'; b.setAttribute('aria-label','返回星轨'); b.textContent='＜';
      b.style.cssText='position:fixed;top:10px;left:10px;width:44px;height:44px;border:none;background:transparent;color:#8B6F57;font-size:26px;font-weight:200;font-family:Helvetica,Arial,sans-serif;line-height:1;cursor:pointer;z-index:50;display:none;padding:0;-webkit-text-stroke:0;transform:scaleX(.8)';
      b.addEventListener('click',function(){ save(); show('companion'); renderCompanion(); });
      document.body.appendChild(b); }
    var vis=(currentScreen==='review') || (currentScreen==='daily' && (state.currentDay||1)>=2);
    b.style.display=vis?'block':'none';
  }

  /* ---------- 占位实现（后续逐步完善） ---------- */
  function routeAfterOpen(){
    if(doneCount()>0){ show('companion'); if(typeof renderCompanion==='function'){ renderCompanion(); } }
    else if(typeof startGuide==='function'){ startGuide(); }
    else { show('guide'); }
  }
  function openCover(){
    var book=$('book'), sc=$('screen-cover');
    if(!book||book.classList.contains('opening')){ if(sc) sc.classList.remove('leaving'); setTimeout(routeAfterOpen, 60); return; }
    book.classList.add('opening');
    if(sc) sc.classList.add('leaving');
    setTimeout(routeAfterOpen, 820);
    setTimeout(function(){ book.classList.remove('opening'); if(sc) sc.classList.remove('leaving'); }, 1700);
  }
  function enterDay(n){
    state.currentDay=Math.max(1,Math.min(7,Number(n)||1)); save();

  function renderGuide(step){
    step=Math.max(0,Math.min(2,step|0));
    state.guideStep=step; save();
    renderGuideDots(step);
    var stage=$('guideStage'); if(!stage) return;
    stage.innerHTML=buildGuideStep(step);
    var goBtns=stage.querySelectorAll('[data-go]');
    for(var i=0;i<goBtns.length;i++){
      goBtns[i].addEventListener('click',function(){ renderGuide(parseInt(this.getAttribute('data-go'),10)); });
    }
    var fi=$('focusInput');
    if(fi){ fi.addEventListener('input',function(){ state.focus=fi.value; save(); }); }
    var bs=$('btnStartDay');
    if(bs){ bs.addEventListener('click',function(){ if(fi){ state.focus=fi.value; } save(); state.currentDay=1; save(); enterDay(1); }); }
  }

  /* ---------- 每日日记页 ---------- */
  var timerId=null;
  function startTimer(){
    if(timerId){ clearInterval(timerId); timerId=null; }
    var left=180;
    function paint(){ var el=$('timer'); if(!el) return; var m=Math.floor(left/60), s=left%60;
      el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
    paint();
    timerId=setInterval(function(){
      var el=$('timer'); if(!el){ clearInterval(timerId); timerId=null; return; }
      if(left>0){ left--; paint(); } else { clearInterval(timerId); timerId=null; }
    },1000);
  }
  function renderDayStatus(n,t){
    var box=$('dayStatus'); if(!box) return;
    box.innerHTML='<div class="statusbar">'
      + '<div><div class="sb-date">'+fmtDay(n)+'</div><div class="sb-day">第 '+n+' 天 / 共 7 天</div></div>'
      + '<div class="sb-right"><span class="theme-badge hand">'+esc(t.theme)+'</span>'
      + '<span class="timer" id="timer" aria-label="温柔计时，三分钟">03:00</span></div>'
      + '</div>'
      + '<p class="hint" style="margin-top:8px">温柔计时 · 3 分钟，写多写少都可以</p>';

  function renderDaily(n){
    n=Math.max(1,Math.min(7,Number(n)||1));
    state.currentDay=n; save();
    var t=themeOf(n);
    renderDayStatus(n,t);
    renderTrace(n,t);
    renderWrite(n,t);
    renderAI(n,t);

  function renderTrace(n,t){
    var box=$('traceSection'); if(!box) return;
    box.innerHTML='<div class="day-sec">'
      + '<div class="sec-label">描摹 · 用手指慢慢描一遍</div>'
      + '<div class="trace-box" id="traceBox"></div>'
      + '<p class="hint trace-hint" id="traceHint">在上面按住并拖动，灰色会一点点变成墨色。</p>'
      + '<button class="btn btn-xs btn-ghost" id="btnSkipTrace">跳过描摹，直接写</button>'
      + '</div>';
    buildTraceSVG(t.trace, n);
    var ms=$('btnSkipTrace');
    if(ms){ ms.addEventListener('click',function(){ var ws=$('writeSection'); if(ws&&ws.scrollIntoView){ ws.scrollIntoView({behavior:'smooth',block:'start'}); } }); }
  }
  function buildTraceSVG(sentence, n){
    var box=$('traceBox'); if(!box) return;
    var chars=Array.prototype.slice.call(sentence||'');
    var perLine=11, lines=[];
    for(var i=0;i<chars.length;i+=perLine){ lines.push(chars.slice(i,i+perLine).join('')); }
    if(!lines.length){ lines=['']; }
    var VW=340, PAD=16, FS=26, LH=44;
    var VH=PAD*2+lines.length*LH;
    var uid='traceMask'+n;
    function layer(color){
      var out='';
      for(var li=0;li<lines.length;li++){
        var y=PAD+li*LH+FS*0.84;
        out+='<text x="'+(VW/2)+'" y="'+y.toFixed(1)+'" text-anchor="middle" font-size="'+FS+'" '
          + 'font-family="\'今年也要加油鸭半展开半粗体\',\'今年也要加油鸭\',\'Ma Shan Zheng\',STKaiti,cursive" fill="'+color+'">'+esc(lines[li])+'</text>';
      }
      return out;
    }
    box.innerHTML='<svg class="trace-svg" id="traceSvg" viewBox="0 0 '+VW+' '+VH+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="描摹句：'+esc(sentence)+'">'
      + '<defs><mask id="'+uid+'" maskUnits="userSpaceOnUse" x="0" y="0" width="'+VW+'" height="'+VH+'">'
      +   '<rect x="0" y="0" width="'+VW+'" height="'+VH+'" fill="#fff"/>'
      +   '<path id="tracePath" fill="none" stroke="#000" stroke-width="'+(FS*1.22).toFixed(1)+'" stroke-linecap="round" stroke-linejoin="round" d=""/>'
      + '</mask></defs>'
      + layer('#2B2620')
      + '<g mask="url(#'+uid+')">'+layer('#C9C2B6')+'</g>'
      + '</svg>';

    var svgEl=$('traceSvg'), pathEl=$('tracePath');
    if(!svgEl||!pathEl) return;
    var d='', tracing=false, lastPt=null, total=0, finished=false;
    function toSvg(e){
      var r=svgEl.getBoundingClientRect();
      return { x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH };
    }
    function add(p){
      if(!lastPt){ d+='M'+p.x.toFixed(1)+' '+p.y.toFixed(1); lastPt=p; }
      else{
        var dx=p.x-lastPt.x, dy=p.y-lastPt.y;
        total+=Math.sqrt(dx*dx+dy*dy);
        if(Math.abs(dx)+Math.abs(dy)<1.2){ return; }
        d+='L'+p.x.toFixed(1)+' '+p.y.toFixed(1); lastPt=p;
      }
      pathEl.setAttribute('d',d);
      if(!finished && total>VW*1.6){
        finished=true;
        box.classList.add('traced');
        var hint=$('traceHint');
        if(hint){ hint.textContent='描摹得真好，墨色慢慢显出来了 ✓'; hint.classList.add('done'); }
      }
    }
    svgEl.addEventListener('pointerdown',function(e){
      if(e.button!==undefined && e.button!==0 && e.pointerType==='mouse'){ return; }
      e.preventDefault(); tracing=true; lastPt=null;
      if(svgEl.setPointerCapture){ try{ svgEl.setPointerCapture(e.pointerId); }catch(err){} }
      add(toSvg(e));
    });
    svgEl.addEventListener('pointermove',function(e){
      if(!tracing) return;
      e.preventDefault(); add(toSvg(e));
    });
    function stop(){ tracing=false; lastPt=null; }
    svgEl.addEventListener('pointerup',stop);
    svgEl.addEventListener('pointercancel',stop);
  }
  var MOODS=['开心','感谢','安心','满足','感动','幸福'];
  function debounce(fn,ms){ var t=null; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); },ms||280); }; }
  var saveDebounced=debounce(function(){ save(); },300);
  function nonFinal(s){ return s.trim().replace(/[，。！!、,.；;：:\s]+$/,''); }
  function pastOf(good){
    return nonFinal(good);
  }
  function updatePreview(){
    var g=$('fGood'), m=$('fMood'), p=$('previewLine'); if(!p) return;
    var good=nonFinal(g?g.value:'');
    var mood=nonFinal(m?m.value:'');
    p.innerHTML='今天，'+(good?'<b class="gold-t">'+esc(pastOf(good))+'</b>':'<span class="blank"></span>')
      +'，<br>我真的很'+(mood?'<b class="gold-t">'+esc(mood)+'</b>':'<span class="blank"></span>')+'！';
  }
  function renderWrite(n,t){
    var box=$('writeSection'); if(!box) return;
    var d=dayData(n);
    var ro=!!d.done; /* 已收下 → 只读 */
    var chips='';
    for(var i=0;i<MOODS.length;i++){
      chips+='<button type="button" class="chip'+(d.mood===MOODS[i]?' on':'')+'" data-mood="'+MOODS[i]+'"'+(ro?' disabled':'')+'>'+MOODS[i]+'</button>';
    }
    box.innerHTML='<div class="day-sec">'
      + '<div class="sec-label">写下今天</div>'
      + '<div class="write-card">'
      +   '<div class="wr-row"><label class="wr-label" for="fToday">今天</label>'
      +     '<input class="field-line" id="fToday" type="text" readonly tabindex="-1" value="'+esc(fmtDay(n))+'"/></div>'
      +   '<div class="wr-row"><label class="wr-label" for="fGood">我相信会发生的一件好事是</label>'
      +     '<textarea class="field-line" id="fGood" maxlength="90" placeholder="一句话就好，不必长篇大论…"'+(ro?' readonly':'')+'>'+esc(d.good||'')+'</textarea></div>'
      +   '<div class="wr-row"><label class="wr-label" for="fMood">那一刻我的心情会是</label>'
      +     '<input class="field-line" id="fMood" type="text" maxlength="12" autocomplete="off" placeholder="开心 / 感谢 / 安心…" value="'+esc(d.mood||'')+'"'+(ro?' readonly':'')+'/></div>'
      +   '<div class="chips" id="moodChips">'+chips+'</div>'
      + '</div>'
      + '<div class="preview-box"><p class="hint">今天的句子</p>'
      +   '<p class="script preview-line" id="previewLine"></p></div>'
      + '</div>';
    var g=$('fGood'), m=$('fMood');
    if(g && !ro){ g.addEventListener('input',function(){ dayData(n).good=g.value; saveDebounced(); updatePreview(); }); }
    if(m && !ro){ m.addEventListener('input',function(){ dayData(n).mood=m.value; syncChips(); saveDebounced(); updatePreview(); }); }
    var cs=$('moodChips');
    if(cs && !ro){ cs.addEventListener('click',function(e){
      var b=e.target.closest ? e.target.closest('[data-mood]') : null;
      if(!b) return;
      var mv=b.getAttribute('data-mood');
      if(m){ m.value=mv; }
      dayData(n).mood=mv; save(); syncChips(); updatePreview();
    }); }
    updatePreview();
  }
  function syncChips(){
    var m=$('fMood'), cs=$('moodChips'); if(!cs) return;
    var v=(m?m.value:'').trim(), list=cs.querySelectorAll('[data-mood]');
    for(var i=0;i<list.length;i++){ if(list[i].getAttribute('data-mood')===v){ list[i].classList.add('on'); } else { list[i].classList.remove('on'); } }
  }

      d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+','+p2.x.toFixed(1)+' '+p2.y.toFixed(1);

    function makeShare2(){
      var QR='https://cdn.youmindassets.com/user-files/92720f3125c68072fc0a0e2cc4a41649f23877c75dfce3f7ed4ed62127e62d6f?width=4000&height=4000&fit=scale-down';
      var FONT='"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif';
      showToast('正在生成图片…');
      QR='https://cdn.youmindassets.com/user-files/92720f3125c68072fc0a0e2cc4a41649f23877c75dfce3f7ed4ed62127e62d6f';
      var plainQR=false;
      var B0='https://cdn.youmindassets.com/user-files/92720f3125c68072fc0a0e2cc4a41649f23877c75dfce3f7ed4ed62127e62d6f';
      function ld(src,cors){ return new Promise(function(res,rej){
        var im=new Image(), t=setTimeout(function(){ rej(new Error('timeout')); },8000);
        if(cors) im.crossOrigin='anonymous';
        im.onload=function(){ clearTimeout(t); im.naturalWidth?res(im):rej(new Error('empty')); };
        im.onerror=function(){ clearTimeout(t); rej(new Error('err')); };
        im.src=src; }); }
      function ldBlob(){ return new Promise(function(res,rej){
        var t=setTimeout(function(){ rej(new Error('timeout')); },8000);
        fetch(B0).then(function(r){ return r.blob(); }).then(function(b){
          var u=URL.createObjectURL(b), im=new Image();
          im.onload=function(){ clearTimeout(t); res(im); };
          im.onerror=function(){ clearTimeout(t); rej(new Error('err')); };
          im.src=u; }).catch(function(e){ clearTimeout(t); rej(e); }); }); }
      (window.loadQR?window.loadQR().then(function(r){ return r&&r.cors?r.img:null; }):Promise.resolve(null))
        .then(function(img){ plainQR=!img;
          var fp=Promise.all([document.fonts.load('400 20px "Noto Serif SC"','未来日记第天今你写下我真的很开心备忘录扫码关注北辰青年'),document.fonts.ready]).catch(function(){});
          var to=new Promise(function(r){ setTimeout(r,4000); });
          return Promise.race([fp,to]).then(function(){ gen(img); }); });
      function gen(qrImg){
        try{
          if(!qrImg) showToast('二维码无法绘制，请在预览中长按识别/保存二维码');
          var S=2, W=750, P=48, TW=W-P*2;
          var cv=document.createElement('canvas'), ctx=cv.getContext('2d');
          function wrap(t,font){ ctx.font=font; var out=[], cur='';
            String(t).split('\n').forEach(function(para){ cur='';
              for(var k=0;k<para.length;k++){ var ch=para[k]; if(ctx.measureText(cur+ch).width>TW && cur){ out.push(cur); cur=ch; } else cur+=ch; }
              out.push(cur); });
            return out; }
          var items=[]; // {t,font,color,lh,gap}
          function add(t,font,color,lh,gap,center){ wrap(t,font).forEach(function(l,i,a){ items.push({t:l,font:font,color:color,lh:lh,gap:i==a.length-1?gap:0,c:center}); }); }
          function sep(){ items.push({sep:1,lh:1}); }
          function sp(n){ items.push({sp:1,lh:n}); }
          var F=function(px){ return "400 "+px+"px 'Noto Serif SC','Songti SC','STSong','SimSun',serif"; };
          sp(56);
          add('未来日记 · 7 天',F(16),'#A08A5A',22,14);
          add('《'+focusTxt+'的未来日记 · 7 天》',F(30),'#2B2620',40,36);
          sep();
          for(var i=1;i<=7;i++){
            var d=state.days[i]||{}, g=(d.good||'').trim(), m=(d.mood||'').trim()||'开心';
            var memo=mergeMemo(d);
            sp(28);
            add('第'+i+'天 · '+themeOf(i).theme+' · '+fmtDay(i),F(20),'#8B5E34',20,0);
            if(g||memo){
              sp(16);
              if(g){ add('今天，'+pastOf(g)+'，',F(22),'#2B2620',34,0); add('我真的很'+m+'！',F(22),'#2B2620',34,0); }
              if(memo){ if(g) sp(14); add('备忘录：'+memo,F(17),'#8A7358',26,0); }
              sp(28);
            } else sp(20);
            sep();
          }
          sp(32);
          add('扫码关注「北辰青年」，解锁更多好玩的实验',F(18),'#2B2620',26,0,true);
          sp(24);
          var H=0; items.forEach(function(it){ H+=it.lh+(it.gap||0); });
          H+=240+56;
          cv.width=W*S; cv.height=Math.ceil(H)*S; ctx.scale(S,S);
          ctx.fillStyle='#FBF6EC'; ctx.fillRect(0,0,W,H);
          ctx.textBaseline='middle';
          var y=0;
          items.forEach(function(it){
            if(it.sp){ y+=it.lh; return; }
            if(it.sep){ ctx.strokeStyle='rgba(201,162,39,.45)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(P,y+.5); ctx.lineTo(W-P,y+.5); ctx.stroke(); y+=it.lh; return; }
            ctx.font=it.font; ctx.fillStyle=it.color||'#000';
            if(it.c){ ctx.textAlign='center'; ctx.fillText(it.t,W/2,y+it.lh/2); } else { ctx.textAlign='left'; ctx.fillText(it.t,P,y+it.lh/2); }
            y+=it.lh+(it.gap||0);
          });
          var drew=false;
          y+=0;
          (function(){
            var r=16, bw=240, bx=(W-bw)/2, by=y;
            function plate(){ ctx.beginPath(); ctx.moveTo(bx+r,by); ctx.arcTo(bx+bw,by,bx+bw,by+bw,r); ctx.arcTo(bx+bw,by+bw,bx,by+bw,r); ctx.arcTo(bx,by+bw,bx,by,r); ctx.arcTo(bx,by,bx+bw,by,r); ctx.closePath(); }
            if(qrImg){ try{
              ctx.fillStyle='#fff'; plate(); ctx.fill();
              ctx.drawImage(qrImg,bx+10,by+10,220,220); drew=true;
            }catch(e){ drew=false; } }
            if(!drew){
              ctx.fillStyle='#8A7358'; ctx.font=F(16); ctx.textAlign='center'; ctx.textBaseline='middle';
              ctx.fillText('长按页面预览处的二维码识别关注',W/2,by+40);
            }
          })();
          var QRSRC='https://cdn.youmindassets.com/user-files/92720f3125c68072fc0a0e2cc4a41649f23877c75dfce3f7ed4ed62127e62d6f';
          cv.toBlob(function(blob){
            if(!blob){ showToast('图片生成失败，请重试'); return; }
            var url=URL.createObjectURL(blob);
            var a=document.createElement('a'); a.href=url; a.download='未来日记7天.png';
            document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); },80);
            showToast('图片已生成');
            var ov=document.createElement('div');
            ov.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(30,26,20,.82);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:20px 16px;box-sizing:border-box;';
            ov.innerHTML='<p style="color:#fff;font-size:14px;margin:0 0 12px;text-align:center">图片已生成并保存，如未自动下载请长按图片保存</p>'
              +'<img src="'+url+'" style="width:100%;max-width:375px;height:auto;border-radius:8px;-webkit-touch-callout:default"/>'
              +'<p style="color:#fff;font-size:14px;margin:14px 0 8px;text-align:center">'+(drew?'长按识别二维码，关注「北辰青年」':'长按识别二维码，关注「北辰青年」')+'</p><img src="'+QRSRC+'" style="width:180px;height:180px;background:#fff;padding:8px;border-radius:12px;box-sizing:content-box;-webkit-touch-callout:default"/>'
              +'<button style="margin:16px 0 8px;height:44px;padding:0 32px;border-radius:999px;border:0;background:#fff;color:#2B2620;font-size:15px">关闭</button>';
            ov.querySelector('button').onclick=function(){ ov.remove(); };
            document.body.appendChild(ov);
          },'image/png');
        }catch(e){
          if(qrImg){ showToast('二维码绘制失败，改用长按二维码方式'); gen(null); }
          else showToast('图片生成失败：'+(e&&e.message||'未知错误'));
        }
      }
    }

  /* ---------- 二维码加载 ---------- */
  (function(){
    var BASE='https://cdn.youmindassets.com/user-files/92720f3125c68072fc0a0e2cc4a41649f23877c75dfce3f7ed4ed62127e62d6f';
    var cache=null;
    function tryLoad(src,cors){ return new Promise(function(res,rej){
      var im=new Image(), done=false;
      var t=setTimeout(function(){ if(!done){ done=true; rej(new Error('timeout')); } },8000);
      im.onload=function(){ if(!done){ done=true; clearTimeout(t); res(im); } };
      im.onerror=function(){ if(!done){ done=true; clearTimeout(t); rej(new Error('error')); } };
      if(cors) im.crossOrigin='anonymous';
      im.src=src; }); }
    function viaFetch(src){ return fetch(src,{mode:'cors'}).then(function(r){ if(!r.ok) throw new Error('http'); return r.blob(); })
      .then(function(b){ return tryLoad(URL.createObjectURL(b),false); }); }
    window.loadQR=function(){
      if(cache) return cache;
      var P600=BASE+'?width=600&height=600&fit=scale-down&format=png';
      var PA='https://wsrv.nl/?url=cdn.youmindassets.com/user-files/92720f3125c68072fc0a0e2cc4a41649f23877c75dfce3f7ed4ed62127e62d6f&w=600&output=png';
      var PB='https://images.weserv.nl/?url=cdn.youmindassets.com/user-files/92720f3125c68072fc0a0e2cc4a41649f23877c75dfce3f7ed4ed62127e62d6f&w=600&output=png';
      cache=tryLoad(PA,true).then(function(i){ window.__qrSrc=PA; return {img:i,cors:true}; })
        .catch(function(){ return tryLoad(PB,true).then(function(i){ window.__qrSrc=PB; return {img:i,cors:true}; }); })
        .catch(function(){ return tryLoad(BASE,true).then(function(i){ window.__qrSrc=BASE; return {img:i,cors:true}; }); })
        .catch(function(){ return tryLoad(P600,true).then(function(i){ window.__qrSrc=P600; return {img:i,cors:true}; }); })
        .catch(function(){ return viaFetch(BASE).then(function(i){ return {img:i,cors:true}; }); })
        .catch(function(){ return tryLoad(BASE,false).then(function(i){ window.__qrSrc=BASE; return {img:i,cors:false}; }); })
        .catch(function(){ window.__qrSrc=BASE; return {img:null,cors:false}; });
      return cache;
    };
    try{ window.loadQR(); }catch(e){}
  })();
